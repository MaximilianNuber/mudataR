[project]
name = "mudatar-fixtures"
version = "0.0.0"
description = "Oracle fixture generation and verification for mudataR (dev only, never a runtime dependency)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mudata",
  "anndata",
  "scirpy",
  "awkward",
  "zarr",
  "h5py",
  "numpy",
  "pandas",
  "scipy",
]
[tool.uv]
package = false
